[tool.black]
target-version = ["py39"]
extend-exclude = "/(\\.venv|\\.tox)/"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["tests/live/results", ".venv", ".tox"]

[tool.ruff.lint]
select = ["F", "B", "PLW0120"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]
