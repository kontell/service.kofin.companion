[mypy]
python_version = 3.10
mypy_path = lib
files = lib, default.py, service.py
disallow_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True

# The code carried from Kofin's transplant keeps its untyped signatures
# (the fork's shape, so a line can still be read against main); every
# function body is checked.
[mypy-companion.kodidb.*]
disallow_untyped_defs = False
check_untyped_defs = True

# Kodistubs has full annotations but no py.typed marker; analyze it anyway.
[mypy-xbmc,xbmcaddon,xbmcgui,xbmcplugin,xbmcvfs]
follow_untyped_imports = True
